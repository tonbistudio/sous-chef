<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: "Segoe UI", Arial, sans-serif; }
      #c { position: absolute; left: {{x}}px; top: {{y}}px; max-width: 760px; background: #fff; color: #111; font-size: 40px; font-weight: 600; line-height: 1.25;
           padding: 22px 30px; border-radius: 14px; border-left: 12px solid {{color}}; box-shadow: 0 18px 50px rgba(0,0,0,0.45); transform-origin: left center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{duration}}" data-width="1920" data-height="1080">
      <div id="c" class="clip" data-start="0" data-duration="{{duration}}" data-track-index="1">{{text}}</div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const D = {{duration}};
      const tl = gsap.timeline({ paused: true });
      tl.from("#c", { scale: 0.6, opacity: 0, duration: 0.4, ease: "back.out(1.8)" }, 0)
        .to("#c", { scale: 0.85, opacity: 0, duration: 0.3, ease: "power2.in" }, Math.max(0.8, D - 0.35));
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
