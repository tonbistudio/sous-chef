<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: "Segoe UI", Arial, sans-serif; }
      #lt { position: absolute; left: 96px; bottom: 120px; display: flex; align-items: stretch; }
      #bar { width: 10px; background: {{color}}; border-radius: 3px; transform-origin: bottom; }
      #box { margin-left: 18px; background: rgba(12, 14, 18, 0.82); padding: 18px 30px 20px; border-radius: 6px; overflow: hidden; }
      #title { color: #fff; font-size: 54px; font-weight: 700; line-height: 1.1; white-space: nowrap; }
      #subtitle { color: #c9d1dc; font-size: 32px; margin-top: 6px; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{duration}}" data-width="1920" data-height="1080">
      <div id="lt" class="clip" data-start="0" data-duration="{{duration}}" data-track-index="1">
        <div id="bar"></div>
        <div id="box"><div id="title">{{title}}</div><div id="subtitle">{{subtitle}}</div></div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const D = {{duration}};
      const tl = gsap.timeline({ paused: true });
      tl.from("#bar", { scaleY: 0, duration: 0.35, ease: "power3.out" }, 0)
        .from("#box", { clipPath: "inset(0 100% 0 0)", duration: 0.55, ease: "power3.out" }, 0.15)
        .from("#title", { x: -40, opacity: 0, duration: 0.45, ease: "power2.out" }, 0.3)
        .from("#subtitle", { x: -30, opacity: 0, duration: 0.45, ease: "power2.out" }, 0.42)
        .to("#lt", { x: -60, opacity: 0, duration: 0.45, ease: "power2.in" }, Math.max(1, D - 0.5));
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
