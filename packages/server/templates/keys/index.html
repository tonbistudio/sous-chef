<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: "Segoe UI", Arial, sans-serif; }
      #c { position: absolute; left: 0; right: 0; bottom: 150px; display: flex; justify-content: center; align-items: center; gap: 18px; }
      .k { min-width: 110px; height: 110px; padding: 0 30px; border-radius: 18px; background: linear-gradient(#fafafa, #dcdcdc); color: #1a1a1a; font-size: 46px; font-weight: 700;
           display: grid; place-items: center; box-shadow: 0 10px 0 #9a9a9a, 0 22px 40px rgba(0,0,0,0.5); border: 2px solid #fff; }
      .k.down { box-shadow: 0 3px 0 #9a9a9a, 0 10px 22px rgba(0,0,0,0.45); border-color: {{color}}; }
      .plus { color: #fff; font-size: 54px; font-weight: 700; text-shadow: 0 3px 12px rgba(0,0,0,0.7); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{duration}}" data-width="1920" data-height="1080">
      <div id="c" class="clip" data-start="0" data-duration="{{duration}}" data-track-index="1"></div>
      <template id="src">{{keys}}</template>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const D = {{duration}};
      const tl = gsap.timeline({ paused: true });
      const c = document.getElementById("c");
      const keys = document.getElementById("src").innerHTML.split("+").map((s) => s.trim()).filter(Boolean).slice(0, 5);
      keys.forEach((k, i) => {
        if (i) { const p = document.createElement("div"); p.className = "plus"; p.textContent = "+"; c.appendChild(p); }
        const el = document.createElement("div"); el.className = "k"; el.innerHTML = k; c.appendChild(el);
      });
      const caps = [...c.querySelectorAll(".k")];
      tl.from(c.children, { y: 60, opacity: 0, duration: 0.35, stagger: 0.07, ease: "back.out(1.7)" }, 0);
      // Each key goes down in turn and they all come up together, as tweens so scrubbing back undoes them.
      caps.forEach((el, i) => tl.to(el, { y: 7, borderColor: "{{color}}", boxShadow: "0 3px 0 #9a9a9a, 0 10px 22px rgba(0,0,0,0.45)", duration: 0.08 }, 0.6 + i * 0.18));
      tl.to(caps, { y: 0, borderColor: "#ffffff", boxShadow: "0 10px 0 #9a9a9a, 0 22px 40px rgba(0,0,0,0.5)", duration: 0.12 }, 0.75 + caps.length * 0.18 + 0.35)
        .to(c.children, { y: 60, opacity: 0, duration: 0.3, stagger: 0.04, ease: "power2.in" }, Math.max(1.6, D - 0.45));
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
