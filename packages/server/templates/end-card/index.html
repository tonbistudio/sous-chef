<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: "Segoe UI", Arial, sans-serif; }
      #bg { position: absolute; inset: 0; background: radial-gradient(circle at 50% 30%, #23262e, #0b0c10 70%); }
      #c { position: absolute; inset: 0; color: #fff; text-align: center; }
      #t { position: absolute; top: 120px; left: 0; right: 0; font-size: 96px; font-weight: 800; }
      #s { position: absolute; top: 250px; left: 0; right: 0; font-size: 44px; color: {{color}}; font-weight: 600; }
      .slot { position: absolute; top: 400px; width: 760px; height: 428px; border-radius: 20px; border: 4px dashed rgba(255,255,255,0.35); }
      #l { left: 160px; } #r { right: 160px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{duration}}" data-width="1920" data-height="1080">
      <div id="bg" class="clip" data-start="0" data-duration="{{duration}}" data-track-index="0"></div>
      <div id="c" class="clip" data-start="0" data-duration="{{duration}}" data-track-index="1"><div id="t">{{title}}</div><div id="s">{{subtitle}}</div><div class="slot" id="l"></div><div class="slot" id="r"></div></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const D = {{duration}};
      const tl = gsap.timeline({ paused: true });
      tl.from("#bg", { opacity: 0, duration: 0.5 }, 0)
        .from("#t", { y: -50, opacity: 0, duration: 0.55, ease: "power3.out" }, 0.2)
        .from("#s", { opacity: 0, duration: 0.4 }, 0.5)
        .from(".slot", { scale: 0.85, opacity: 0, duration: 0.5, stagger: 0.12, ease: "back.out(1.5)" }, 0.6);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
