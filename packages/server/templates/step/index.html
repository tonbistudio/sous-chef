<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: "Segoe UI", Arial, sans-serif; }
      #c { position: absolute; left: 90px; top: 90px; display: flex; align-items: center; gap: 0; }
      #n { width: 110px; height: 110px; border-radius: 50%; background: {{color}}; color: #111; font-size: 60px; font-weight: 800; display: grid; place-items: center;
           box-shadow: 0 14px 40px rgba(0,0,0,0.45); position: relative; z-index: 2; }
      #t { background: rgba(14,16,20,0.92); color: #fff; font-size: 44px; font-weight: 600; padding: 22px 40px 22px 74px; margin-left: -50px; border-radius: 0 18px 18px 0;
           white-space: nowrap; box-shadow: 0 14px 40px rgba(0,0,0,0.45); clip-path: inset(0 0 0 0); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{duration}}" data-width="1920" data-height="1080">
      <div id="c" class="clip" data-start="0" data-duration="{{duration}}" data-track-index="1"><div id="n">{{number}}</div><div id="t">{{text}}</div></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const D = {{duration}};
      const tl = gsap.timeline({ paused: true });
      tl.from("#n", { scale: 0, rotation: -120, duration: 0.5, ease: "back.out(1.8)" }, 0)
        .from("#t", { clipPath: "inset(0 100% 0 0)", duration: 0.5, ease: "power3.out" }, 0.3)
        .to("#t", { clipPath: "inset(0 100% 0 0)", duration: 0.35, ease: "power3.in" }, Math.max(1.2, D - 0.6))
        .to("#n", { scale: 0, duration: 0.3, ease: "back.in(1.8)" }, Math.max(1.4, D - 0.35));
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
