<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: "Segoe UI", Arial, sans-serif; }
      #bg { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(10,12,16,0.92), rgba(0,0,0,0.97)); }
      #t { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-60%); text-align: center; color: #fff; font-size: 104px; font-weight: 800; letter-spacing: -1px; }
      #rule { position: absolute; left: 50%; top: 58%; width: 220px; height: 8px; margin-left: -110px; background: {{color}}; border-radius: 4px; }
      #s { position: absolute; left: 0; right: 0; top: 63%; text-align: center; color: #c9d1dc; font-size: 42px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{duration}}" data-width="1920" data-height="1080">
      <div id="bg" class="clip" data-start="0" data-duration="{{duration}}" data-track-index="0"></div>
      <div id="t" class="clip" data-start="0" data-duration="{{duration}}" data-track-index="1">{{title}}</div>
      <div id="rule" class="clip" data-start="0" data-duration="{{duration}}" data-track-index="2"></div>
      <div id="s" class="clip" data-start="0" data-duration="{{duration}}" data-track-index="3">{{subtitle}}</div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const D = {{duration}};
      const tl = gsap.timeline({ paused: true });
      tl.from("#bg", { opacity: 0, duration: 0.5 }, 0)
        .from("#t", { y: 40, opacity: 0, duration: 0.6, ease: "power3.out" }, 0.2)
        .from("#rule", { scaleX: 0, duration: 0.5, ease: "power3.out" }, 0.45)
        .from("#s", { y: 20, opacity: 0, duration: 0.5, ease: "power2.out" }, 0.6)
        .to(["#t", "#rule", "#s"], { opacity: 0, duration: 0.4 }, Math.max(1.2, D - 0.7))
        .to("#bg", { opacity: 0, duration: 0.5 }, Math.max(1.4, D - 0.5));
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
