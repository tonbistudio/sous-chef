<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: "Segoe UI", Arial, sans-serif; }
      #c { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      svg { position: absolute; left: 0; top: 0; overflow: visible; }
      #glow { filter: blur(10px); opacity: 0.55; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{duration}}" data-width="1920" data-height="1080">
      <div id="c" class="clip" data-start="0" data-duration="{{duration}}" data-track-index="1"><svg width="1920" height="1080"><rect id="glow" x="{{x}}" y="{{y}}" width="{{w}}" height="{{h}}" rx="22" fill="none" stroke="{{color}}" stroke-width="14"/><rect id="r" x="{{x}}" y="{{y}}" width="{{w}}" height="{{h}}" rx="22" fill="none" stroke="{{color}}" stroke-width="7"/></svg></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const D = {{duration}};
      const tl = gsap.timeline({ paused: true });
      const len = 2 * ({{w}} + {{h}});
      gsap.set(["#r", "#glow"], { strokeDasharray: len, strokeDashoffset: len });
      tl.to(["#r", "#glow"], { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, 0)
        .to("#glow", { opacity: 0.25, duration: 0.6, yoyo: true, repeat: Math.max(0, Math.floor((D - 1.6) / 0.6)), ease: "sine.inOut" }, 0.7)
        .to(["#r", "#glow"], { opacity: 0, duration: 0.3 }, Math.max(1, D - 0.35));
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
